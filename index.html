<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY BOY</title><style>
*{box-sizing:border-box}body{margin:0;background:#171717;color:#ddd;font-family:Arial,Helvetica,sans-serif}.wrap{width:min(760px,94vw);margin:35px auto 80px}h1{font-size:clamp(60px,15vw,130px);line-height:.8;margin:0 0 35px;letter-spacing:-.07em;color:#eee}.inventory{background:linear-gradient(#292929,#1b1b1b);border:1px solid #454545;box-shadow:0 12px 40px #000;padding:18px}.hero{display:grid;grid-template-columns:minmax(320px,1.25fr) 1fr;gap:20px}.pic{background:radial-gradient(circle,#3a3a3a,#202020);min-height:360px;display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:100%;max-width:360px;transform:scale(1.28);}.name{color:#cf6a32;font-size:28px;margin:3px 0 12px}.meta{font:14px/1.55 Arial;color:#bdbdbd}.meta b{color:#7ea9d8;font-weight:normal}.paint{color:#b9b9b9}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:16px}.slot{aspect-ratio:1;background:#222;border:1px solid #3d3d3d;position:relative;overflow:hidden}.slot img{width:100%;height:100%;object-fit:contain}.swatch{position:absolute;right:5px;bottom:5px;width:15px;height:15px;background:#111;border:1px solid #777}.num{position:absolute;left:5px;bottom:4px;font:bold 9px Arial;color:#bbb;text-shadow:1px 1px #000}.creator{text-align:center;margin:18px 0 0;font:12px monospace;letter-spacing:.16em;color:#777}.generate{display:block;margin:45px auto 0;padding:18px 25px;background:#292929;border:1px solid #555;color:#ddd;font:bold 12px Arial;letter-spacing:.08em;cursor:pointer}.generate:hover{background:#333}.generated{text-align:center;height:30px;margin-top:15px;font:12px monospace;color:#cf6a32}@media(max-width:600px){.hero{grid-template-columns:1fr}.pic{min-height:330px}.pic img{max-width:330px;transform:scale(1.22)}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="wrap"><h1>MY BOY</h1><section class="inventory"><div class="hero"><div class="pic"><img src="https://media.steampowered.com/apps/440/icons/demo_parrot_large.378d19ae8a56569c9233cf2ee7ef98222fa2e615.png"></div><div><div class="name">"MY BOY"</div><div class="meta">Team Fortress 2<br>Strange Mascot<br><b>Crafted by POLTERGIEST</b><br>Style: Essential<br><span class="paint">Paint Color: A Distinctive Lack of Hue</span><br><small style="color:#777">Painted variant — inventory icon shown in its original TF2 artwork</small><br><br>(Not Tradable or Marketable)</div></div></div><div class="grid" id="farm"></div><div class="creator">CREATED BY POLTERGIEST</div></section><button class="generate" id="generate">GENERATE A NEW MY BOY</button><div class="generated" id="generated"></div></main><script>
const img='https://media.steampowered.com/apps/440/icons/demo_parrot_large.378d19ae8a56569c9233cf2ee7ef98222fa2e615.png';document.querySelector('#farm').innerHTML=Array.from({length:22},(_,i)=>'<div class="slot"><img src="'+img+'"><i class="swatch"></i><span class="num">'+String(i+1).padStart(2,'0')+'</span></div>').join('');document.querySelector('#generate').onclick=()=>{document.querySelector('#generated').textContent='MY BOY '+String(Math.floor(Math.random()*999999)).padStart(6,'0')+' GENERATED'};
</script></body></html>
