<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MY BOY FARM</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#eee;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}main{width:100%;padding:32px}h1{font-size:clamp(4rem,15vw,12rem);line-height:.78;letter-spacing:-.08em;margin:0 0 60px;text-transform:uppercase}button{background:#eee;color:#050505;border:0;padding:20px 30px;font:bold 13px monospace;letter-spacing:.16em;cursor:pointer;text-transform:uppercase}button:hover{background:#9adf37}.boy{margin:36px auto 0;min-height:110px;font:12px/1.9 monospace;letter-spacing:.12em;color:#777}.boy b{display:block;color:#9adf37;font-size:20px;margin-bottom:5px}
</style></head><body><main><h1>MY BOY<br>FARM</h1><button id="generate">GENERATE A NEW MY BOY</button><div class="boy" id="boy"></div></main><script>
const b=document.querySelector('#generate'),o=document.querySelector('#boy');b.onclick=()=>{const id='MY BOY '+String(Math.floor(Math.random()*999999)).padStart(6,'0');o.innerHTML='<b>'+id+'</b>HAS BEEN GENERATED.'};
</script></body></html>
